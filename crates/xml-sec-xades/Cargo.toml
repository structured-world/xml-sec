[package]
name = "xml-sec-xades"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0 AND MIT"
publish = false
description = "XAdES baseline validation of signatures verified by xml-sec"

[dependencies]
xml-sec = { path = "../..", default-features = false, features = ["xmldsig", "c14n", "cms"] }
structured-xades = { version = "0.20.3", default-features = false, features = ["alloc"] }
structured-asn1 = { version = "0.20.3", default-features = false, features = ["alloc"] }
structured-pkix = { version = "0.20.3", default-features = false, features = ["alloc"] }
structured-cms = { version = "0.20.3", default-features = false, features = ["alloc"] }
structured-ltv = { version = "0.20.3", default-features = false, features = ["alloc"] }
thiserror = { version = "2", default-features = false }
base64 = { version = "0.23", default-features = false, features = ["alloc"], optional = true }

[dev-dependencies]
base64 = "0.23"
divan = "0.1.21"
roxmltree = "0.21"

[features]
default = ["std", "xml-backend-xmloxide"]
# Signature creation over the XMLDSig signer. Verification-only builds,
# including alloc and WASM ones, do not take the signing dependencies.
produce = ["std", "xml-sec/xmldsig-sign", "dep:base64"]
std = [
    "xml-sec/std",
    "structured-xades/std",
    "structured-asn1/std",
    "structured-pkix/std",
    "structured-cms/std",
    "structured-ltv/std",
    "thiserror/std",
]
xml-backend-xmloxide = ["xml-sec/xml-backend-xmloxide"]
xml-backend-roxmltree = ["xml-sec/xml-backend-roxmltree"]

[[example]]
name = "create_probe"
required-features = ["produce"]

[[example]]
name = "augment_probe"
required-features = ["produce"]

[[bench]]
name = "lifecycle"
harness = false
required-features = ["produce"]

[[bench]]
name = "augmentation"
harness = false
required-features = ["produce"]

[lints]
workspace = true
