[package]
name = "xml-sec-libxml2"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0 AND MIT"
publish = false
description = "The document tree of the libxmlsec1 surface, without libxml2"

[lib]
# The library exports the clean C API together with the tree functions;
# `rlib` lets the crate's own Rust tests call the exported functions.
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# The owned tree is the documents' storage whichever parser backend the
# clean C API selects.
xml-sec = { path = "../..", default-features = false, features = ["std", "xmldsig", "xmldsig-sign", "xmlenc", "c14n", "owned-tree"] }
xml-sec-capi = { path = "../xml-sec-capi", default-features = false, features = ["external-tree"] }
# The C heap the library hands memory out from, released with `xsFree`.
libc = "0.2"
# The handle table is process-global, as C handles are.
parking_lot = "0.13"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[features]
default = ["xml-backend-xmloxide"]
xml-backend-xmloxide = ["xml-sec-capi/xml-backend-xmloxide"]
xml-backend-roxmltree = ["xml-sec-capi/xml-backend-roxmltree"]

[lints]
workspace = true
