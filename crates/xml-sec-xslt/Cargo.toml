[package]
name = "xml-sec-xslt"
version = "0.1.1"
publish = false
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0"
description = "Safe Rust XSLT 1.0 compiler and runtime"
repository = "https://github.com/structured-world/xml-sec"
readme = "README.md"

[lib]
name = "xml_sec_xslt"
# The published xml-sec package compiles the same sources for its XSLT transform.
path = "../../src/xslt/lib.rs"

[features]
benchmark-internals = []

[[example]]
name = "xslt_latency"
path = "../../benchmarks/xslt-latency.rs"
required-features = ["benchmark-internals"]

[[bench]]
name = "xslt"
path = "../../benchmarks/xslt-alloc.rs"
harness = false
required-features = ["benchmark-internals"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("embedded"))'] }

[dependencies]
encoding_rs = "0.8"
icu_collator = "2.3.1"
icu_locale = "2.3.1"
md-5 = "0.11"
roxmltree = { version = "0.21", features = ["positions"] }
sha1 = "0.11"
sxd-document-no-unsafe = { package = "xml-sec-sxd-document", version = "0.1.0", path = "../../vendor/sxd-document-no-unsafe", default-features = false, features = ["no-unsafe"] }
sxd-xpath-no-unsafe = { package = "xml-sec-sxd-xpath", version = "0.1.1", path = "../../vendor/sxd-xpath-no-unsafe", default-features = false, features = ["no-unsafe"] }
thiserror = "2"
time = { version = "0.3.55", features = ["local-offset"] }
url = "2"
xml-sec-xml-input = { version = "0.1.0", path = "../xml-sec-xml-input" }

[dev-dependencies]
pretty_assertions = "1"
divan = "=0.1.21"
serde_json = "1"
