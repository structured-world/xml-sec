[package]
name = "xml-sec-xmlsec1"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0 AND MIT"
publish = false
description = "libxmlsec1 source and extension compatibility over the xml-sec core"

[lib]
# C programs link the shared or static library; `rlib` lets the crate's own
# Rust tests call the exported functions.
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
xml-sec = { path = "../..", default-features = false, features = ["std", "xmldsig", "c14n", "external-tree", "rustcrypto"] }
xml-sec-libxml2 = { path = "../xml-sec-libxml2" }
# C `fputs` for debug dumps to a caller's `FILE*`.
libc = "0.2"

[dev-dependencies]
tempfile = "3"
# The tests are the C caller: they load the system libxml2 into the process.
xml-sec-libxml2 = { path = "../xml-sec-libxml2", features = ["test-support"] }

[lints]
workspace = true
