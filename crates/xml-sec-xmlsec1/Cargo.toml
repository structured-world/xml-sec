[package]
name = "xml-sec-xmlsec1"
edition = "2024"
# C-variadic definitions (`xmlSecError`) are stable from 1.99.
rust-version = "1.99"
license = "Apache-2.0 AND MIT"
publish = false
description = "libxmlsec1 source and extension compatibility over the xml-sec core"

[lib]
# C programs link the shared or static library; `rlib` lets the crate's own
# Rust tests call the exported functions.
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
xml-sec = { path = "../..", default-features = false, features = ["std", "xmldsig", "c14n", "owned-tree", "rustcrypto"] }
xml-sec-libxml2 = { path = "../xml-sec-libxml2" }
# C `fputs` for debug dumps to a caller's `FILE*`.
libc = "0.2"
# The resumable Base64 codec behind `xmlSecBase64Ctx`.
structured-base64 = "0.21"
# Private keys held by key data are wiped when released.
zeroize = "1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
