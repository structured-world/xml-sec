[package]
name = "xmlsec1-cli"
version = "0.1.11"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0"
description = "Pure Rust xmlsec1-compatible command-line interface"
repository = "https://github.com/structured-world/xml-sec"
homepage = "https://github.com/structured-world/xml-sec"
readme = "README.md"
keywords = ["xml", "xmldsig", "xmlenc", "xmlsec"]
categories = ["command-line-utilities", "cryptography"]
exclude = ["tests/"]

[[bin]]
name = "xmlsec1"
path = "src/main.rs"

[dependencies]
base64 = "0.23"
getrandom = { version = "0.4", features = ["sys_rng"] }
quick-xml = "0.41"
roxmltree = "0.21"
rsa = { package = "sad-rsa", version = "0.2.3", features = ["sha1", "sha2"] }
thiserror = "2"
x509-parser = "0.18"
xml-sec = { version = "0.1.13", path = "../..", features = ["xmldsig", "xmlenc", "c14n"] }

[dev-dependencies]
rand_chacha = "0.10"
tempfile = "3"
