[package]
name = "xml-sec-capability-ledger"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0 AND MIT"
publish = false

[dependencies]
# Reads the dynamic symbol tables of the built libxmlsec1 libraries.
object = { version = "0.40", default-features = false, features = ["read_core", "elf", "macho", "std"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
syn = { version = "3", features = ["full"] }
tempfile = "3"

[lints]
workspace = true
