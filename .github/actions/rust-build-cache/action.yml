name: Compatible Rust dependency cache
description: Restore compatible dependencies and save before successful cleanup
inputs:
  domain:
    description: Compatibility domain, including instrumentation and build mode
    required: true
  toolchain:
    description: Installed compiler used by this job
    default: stable
  workspace:
    description: Cargo workspace relative to the checkout
    default: '.'
  save:
    description: Whether this job owns writes to the shared cache
    default: 'false'
  mold:
    description: >-
      Link with mold on Linux. A job that also builds for a target other than
      the host turns it off: RUSTFLAGS reach every target, and rustc accepts
      -C linker-features only on x86_64-unknown-linux-gnu.
    default: 'true'
runs:
  using: composite
  steps:
    # mold links with fewer threads and less random I/O than the self-contained
    # rust-lld; it exists for Linux only. RUSTFLAGS is set before the cache step
    # so the restored artifacts match the flags they were built with.
    - name: Link with mold
      if: runner.os == 'Linux' && inputs.mold == 'true'
      shell: bash
      run: |
        sudo apt-get update -q
        sudo apt-get install -y --no-install-recommends mold
        mold --version
        echo "RUSTFLAGS=${RUSTFLAGS:+$RUSTFLAGS }-C linker-features=-lld -C link-arg=-fuse-ld=mold" >> "$GITHUB_ENV"
    - uses: ./.github/actions/runner-image
      id: image
    - uses: ./.github/actions/clean-build-output
      with:
        manifest: ${{ inputs.workspace }}/Cargo.toml
        toolchain: ${{ inputs.toolchain }}
    - uses: Swatinem/rust-cache@v2
      env:
        RUSTUP_TOOLCHAIN: ${{ inputs.toolchain }}
      with:
        prefix-key: xmlsec-build-v1
        shared-key: ${{ inputs.domain }}-${{ steps.image.outputs.identity }}
        workspaces: ${{ inputs.workspace }} -> target
        save-if: ${{ inputs.save }}
        # Preserve runner-provided Cargo/rustup shims for later post actions.
        cache-bin: 'false'
