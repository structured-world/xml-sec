name: Cache native oracle
description: Restore the native installation without bypassing installer validation
inputs:
  profile:
    description: The oracle's capability profile
    required: true
  commit:
    description: The libxmlsec1 commit the installation is built from
    required: true
  prefix:
    description: The installation directory
    required: true
runs:
  using: composite
  steps:
    - uses: ./.github/actions/runner-image
      id: image
    - uses: actions/cache@v6
      with:
        path: ${{ inputs.prefix }}
        key: xmlsec-oracle-${{ runner.os }}-${{ runner.arch }}-${{ steps.image.outputs.identity }}-${{ inputs.profile }}-${{ inputs.commit }}-${{ hashFiles('tools/xml-sec-tools/src/install_xmlsec1.rs') }}
