name: Comparable CLI and library measurements
on:
  workflow_call:
    inputs:
      samples:
        type: number
        default: 1
      publish:
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Locate fresh measurement evidence outside the build cache
        run: |
          printf 'COMPARISON_OUTPUT=%s\nSITE_OUTPUT=%s\nBASELINE_OUTPUT=%s\n' \
            "$RUNNER_TEMP/benchmark-comparison-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            "$RUNNER_TEMP/benchmark-site-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            "$RUNNER_TEMP/benchmark-baseline-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.92.0"
          components: clippy, rustfmt
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: ./.github/actions/rust-build-cache
        with:
          domain: benchmark
          save: 'true'
      - name: Install native benchmark tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes autoconf automake build-essential curl libltdl-dev libssl-dev libtool libxml2-dev libxslt1-dev perl pkg-config valgrind jq
      - name: Test metric interpretation
        run: node --test scripts/compare-security.test.mjs scripts/compare-library.test.mjs scripts/compare-regression.test.mjs
      - name: Lint the in-process competitor harnesses
        run: |
          cargo fmt --manifest-path benchmarks/competitors/Cargo.toml --check
          bash scripts/refresh-competitor-lock.sh
          cargo clippy --locked --manifest-path benchmarks/competitors/Cargo.toml --target-dir target/competitors/library-profile --all-targets --features allocation-profile -- -D warnings
      - name: Validate interoperability and compare identical CLI and library work
        env:
          SAMPLES: ${{ inputs.samples }}
        run: bash scripts/benchmark-compare.sh "$COMPARISON_OUTPUT" "$SAMPLES" --heap
      # The last published default-branch run is the baseline. A file that cannot
      # be fetched stays absent, and the report states that no baseline exists.
      - name: Fetch the published baseline
        run: |
          site="https://$GITHUB_REPOSITORY_OWNER.github.io/${GITHUB_REPOSITORY#*/}"
          mkdir -p "$BASELINE_OUTPUT"
          for file in comparison.json library.json build.json; do
            curl --fail --silent --show-error --location --output "$BASELINE_OUTPUT/$file" "$site/$file" \
              || rm -f "$BASELINE_OUTPUT/$file"
          done
      - name: Report regressions against the baseline
        run: node scripts/compare-regression.mjs "$BASELINE_OUTPUT" "$COMPARISON_OUTPUT" "$COMPARISON_OUTPUT" >> "$GITHUB_STEP_SUMMARY"
      - name: Build static dashboard
        run: node scripts/build-benchmark-dashboard.mjs "$COMPARISON_OUTPUT" "$SITE_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: benchmark-comparison
          path: ${{ env.COMPARISON_OUTPUT }}
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v5
        if: inputs.publish && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: ${{ env.SITE_OUTPUT }}
