name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # RSA-PSS vectors always run; CI additionally requires reciprocal live checks.
  OPENSSL_BIN: openssl
  RUSTFLAGS: -Dwarnings
  XMLSEC1_PREFIX: ${{ github.workspace }}/.tools/xmlsec1-1.3.13
  XMLSEC1_BIN: ${{ github.workspace }}/.tools/xmlsec1-1.3.13/bin/xmlsec1
  LD_LIBRARY_PATH: ${{ github.workspace }}/.tools/xmlsec1-1.3.13/lib

jobs:
  documentation:
    name: documentation (${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: ["1.92.0", stable]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
      - uses: taiki-e/install-action@nextest
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: Swatinem/rust-cache@v2
      - run: node --test scripts/check-documentation.test.mjs
      - run: bash scripts/check-documentation.sh
      - run: cargo clean

  feature-contract:
    name: feature contract (${{ matrix.rust }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rust: "1.92.0"
            os: ubuntu-latest
            minimal: true
          - rust: stable
            os: ubuntu-latest
            minimal: true
          - rust: stable
            os: macos-latest
          - rust: stable
            os: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy
      - uses: taiki-e/install-action@nextest
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: Swatinem/rust-cache@v2
      - name: Check the matrix runner
        if: runner.os != 'Windows'
        run: node --test scripts/check-features.test.mjs
      - name: Qualify actual core defaults
        shell: bash
        run: bash scripts/check-features.sh default
      - name: Provision isolated token provider
        if: matrix.minimal
        run: sudo apt-get update && sudo apt-get install -y softhsm2
      - name: Qualify isolated minimal feature graphs
        if: matrix.minimal
        env:
          PKCS11_MODULE: /usr/lib/softhsm/libsofthsm2.so
        run: |
          for profile in dom-xmloxide dom-roxmltree c14n-xmloxide c14n-roxmltree dsig-xmloxide dsig-roxmltree xmlenc-xmloxide xmlenc-roxmltree xslt legacy experimental fips-dsig pkcs11 no-backend; do
            echo "::group::$profile"
            bash scripts/check-features.sh "$profile"
            echo '::endgroup::'
          done

  security-corpus:
    name: security corpus provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node --test scripts/security-corpus.test.mjs
      - run: node scripts/security-corpus.mjs --check

  benchmark-comparison:
    uses: ./.github/workflows/benchmark-comparison.yml

  benchmark-contract:
    name: benchmark-contract (${{ matrix.toolchain }}, ${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - toolchain: "1.92.0"
            features: benchmark-internals
            extra: ""
          - toolchain: stable
            features: benchmark-internals
            extra: ""
          - toolchain: "1.92.0"
            features: benchmark-internals,aws-lc-fips
            extra: aws-lc-fips
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: taiki-e/install-action@nextest
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: Swatinem/rust-cache@v2
      - run: cargo nextest run --test benchmark_contract --example benchmark_latency --features ${{ matrix.features }}
      - run: cargo clippy --bench security --example benchmark_latency --features ${{ matrix.features }},benchmark-alloc -- -D warnings
      - run: node --test scripts/compare-security.test.mjs
      - name: Exercise measurement runner (not a performance threshold)
        run: bash scripts/benchmark-security.sh "$RUNNER_TEMP/benchmark-smoke-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" 1 '${{ matrix.extra }}'
      - uses: actions/upload-artifact@v7
        with:
          name: benchmark-smoke-${{ matrix.toolchain }}-${{ matrix.extra || 'rustcrypto' }}
          path: ${{ runner.temp }}/benchmark-smoke-${{ github.run_id }}-${{ github.run_attempt }}

  pkcs11:
    name: PKCS11 (${{ matrix.backend }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [xmloxide, roxmltree, differential]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.92.0"
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
      - name: Install isolated token oracle
        run: sudo apt-get update && sudo apt-get install -y softhsm2
      - name: Check optional provider
        run: cargo clippy --no-default-features --features pkcs11,c14n,xml-backend-${{ matrix.backend }} --all-targets -- -D warnings
      - name: Check provider and policy contracts
        run: cargo nextest run --lib --no-default-features --features pkcs11,c14n,xml-backend-${{ matrix.backend }}
      - name: Check configuration with only the token provider enabled
        run: cargo nextest run -p xml-sec-config --no-default-features --features pkcs11,xml-backend-${{ matrix.backend }}
      - name: Exercise token operations with disposable storage
        run: bash scripts/test-pkcs11.sh /usr/lib/softhsm/libsofthsm2.so --no-default-features --features c14n,xml-backend-${{ matrix.backend }}

  capability-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Read pinned donor revision
        id: donor-revision
        run: |
          commit="$(cat compatibility/libxmlsec1-1.3.13-donor-commit.txt)"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: lsh123/xmlsec
          ref: ${{ steps.donor-revision.outputs.commit }}
          path: donors/xmlsec
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.92.0"
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check native CLI upstream fixture snapshot
        run: scripts/import-xmlsec1-cli-fixtures.sh --check
      - name: Check maintained XML parser kernels
        run: |
          bash scripts/import-xml-backends.sh roxmltree --verify
          bash scripts/import-xml-backends.sh xmloxide --verify
      - run: >-
          cargo run -p xml-sec-capability-ledger -- check
          donors/xmlsec
          compatibility/libxmlsec1-1.3.13-rules.json
          compatibility/libxmlsec1-1.3.13.json
      - run: >-
          cargo run -p xml-sec-capability-ledger -- behavior-check
          donors/xmlsec
          compatibility/libxmlsec1-1.3.13-behavior-rules.json
          compatibility/libxmlsec1-1.3.13-behavior.json

  build-matrix:
    name: build-matrix (${{ matrix.rust }}, ${{ matrix.xml-backend }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rust: stable
            xml-backend: xmloxide
            cargo-args: --no-default-features --features xmldsig,xmlenc,c14n,xml-backend-xmloxide
          - rust: stable
            xml-backend: roxmltree
            cargo-args: --no-default-features --features xmldsig,xmlenc,c14n,xml-backend-roxmltree
          - rust: stable
            xml-backend: differential
            cargo-args: --no-default-features --features xmldsig,xmlenc,c14n,xml-backend-differential
          - rust: stable
            xml-backend: fat-runtime
            cargo-args: --no-default-features --features xmldsig,xmlenc,c14n,xml-backends-all
          - rust: stable
            xml-backend: xmlenc-inventory
            cargo-args: --package xml-sec --no-default-features --features xmlenc,xml-backend-xmloxide
          - rust: "1.92.0"
            xml-backend: xmloxide
            cargo-args: --no-default-features --features xmldsig,xmlenc,c14n,xml-backend-xmloxide
          - rust: "1.92.0"
            xml-backend: roxmltree
            cargo-args: --no-default-features --features xmldsig,xmlenc,c14n,xml-backend-roxmltree
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
      - name: Build without enriching the inventory feature graph
        run: >-
          cargo build
          ${{ matrix.xml-backend != 'xmlenc-inventory' && '--workspace' || '' }}
          ${{ matrix.cargo-args }}

  build:
    runs-on: ubuntu-latest
    needs: build-matrix
    if: ${{ always() }}
    steps:
      - run: test "${{ needs.build-matrix.result }}" = "success"

  alloc-only:
    name: alloc-only XML input
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.92.0"
          targets: thumbv7em-none-eabihf,wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo +1.92.0 check -p xml-sec-xml-input --no-default-features
      - run: >-
          cargo +1.92.0 check -p xml-sec-xml-input --no-default-features
          --target thumbv7em-none-eabihf
      - run: bash scripts/check-shared-pkix.sh
        env:
          RUSTUP_TOOLCHAIN: "1.92.0"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: bash scripts/test-wasm-c14n.sh
        env:
          RUSTUP_TOOLCHAIN: "1.92.0"

  test-matrix:
    name: test-matrix (${{ matrix.rust }}, ${{ matrix.xml-backend }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rust: "1.92.0"
            xml-backend: all-features
            all-features: true
            cargo-args: --all-features
          - rust: stable
            xml-backend: all-features
            all-features: true
            cargo-args: --all-features
          - rust: stable
            xml-backend: default-features
            cargo-args: ""
          - rust: "1.92.0"
            xml-backend: experimental-pq-xmloxide
            experimental-pq: true
            cargo-args: --no-default-features --features xmldsig,xmlenc,c14n,xml-backend-xmloxide,legacy-algorithms,experimental-pq
          - rust: "1.92.0"
            xml-backend: experimental-pq-roxmltree
            experimental-pq: true
            cargo-args: --no-default-features --features xmldsig,xmlenc,c14n,xml-backend-roxmltree,legacy-algorithms,experimental-pq
          - rust: "1.92.0"
            xml-backend: experimental-pq-differential
            experimental-pq: true
            cargo-args: --no-default-features --features xmldsig,xmlenc,c14n,xml-backend-differential,legacy-algorithms,experimental-pq
          - rust: stable
            xml-backend: legacy-fat-runtime
            cargo-args: --no-default-features --features xmldsig,xmlenc,c14n,xml-backends-all,legacy-algorithms
          - rust: stable
            xml-backend: xslt-fat-runtime
            cargo-args: --no-default-features --features xmldsig,xmlenc,c14n,xml-backends-all,xslt
          - rust: "1.92.0"
            xml-backend: xslt-xmloxide
            cargo-args: --no-default-features --features xmldsig,xmlenc,c14n,xml-backend-xmloxide,xslt
          - rust: "1.92.0"
            xml-backend: legacy-aws-fips
            native-fips: true
            cargo-args: --no-default-features --features aws-lc-fips,xmlenc,c14n,xml-backend-xmloxide,legacy-algorithms
          - rust: "1.92.0"
            xml-backend: aws-fips-xmloxide
            native-fips: true
            cargo-args: --no-default-features --features aws-lc-fips,xmlenc,c14n,xml-backend-xmloxide
          - rust: "1.92.0"
            xml-backend: aws-fips-roxmltree
            native-fips: true
            cargo-args: --no-default-features --features aws-lc-fips,xmlenc,c14n,xml-backend-roxmltree
          - rust: "1.92.0"
            xml-backend: aws-fips-differential
            native-fips: true
            cargo-args: --no-default-features --features aws-lc-fips,xmlenc,c14n,xml-backend-differential
          - rust: "1.92.0"
            xml-backend: aws-fips-fat-runtime
            native-fips: true
            cargo-args: --no-default-features --features aws-lc-fips,xmlenc,c14n,xml-backends-all
          - rust: stable
            xml-backend: xmloxide
            cargo-args: --no-default-features --features xmldsig,xmlenc,c14n,xml-backend-xmloxide
          - rust: stable
            xml-backend: roxmltree
            cargo-args: --no-default-features --features xmldsig,xmlenc,c14n,xml-backend-roxmltree
          - rust: stable
            xml-backend: differential
            cargo-args: --no-default-features --features xmldsig,xmlenc,c14n,xml-backend-differential
          - rust: stable
            xml-backend: fat-runtime
            cargo-args: --no-default-features --features xmldsig,xmlenc,c14n,xml-backends-all
          - rust: "1.92.0"
            xml-backend: xmloxide
            cargo-args: --no-default-features --features xmldsig,xmlenc,c14n,xml-backend-xmloxide
          - rust: "1.92.0"
            xml-backend: roxmltree
            cargo-args: --no-default-features --features xmldsig,xmlenc,c14n,xml-backend-roxmltree
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Read pinned donor revision
        id: test-donor-revision
        run: |
          commit="$(cat compatibility/libxmlsec1-1.3.13-donor-commit.txt)"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: lsh123/xmlsec
          ref: ${{ steps.test-donor-revision.outputs.commit }}
          path: donors/xmlsec
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
      - uses: taiki-e/install-action@nextest
      - name: Refresh apt package index
        run: sudo apt-get update
      - name: Provision all-feature token tests
        if: matrix.all-features
        run: sudo apt-get install -y softhsm2
      - name: Build pinned xmlsec1 for external-oracle tests
        env:
          XMLSEC1_SOURCE_DIR: ${{ github.workspace }}/donors/xmlsec
          XMLSEC1_MODERN_ORACLE: "1"
        run: |
          sudo apt-get install --yes autoconf automake build-essential curl libltdl-dev libssl-dev libtool libxml2-dev libxslt1-dev perl pkg-config
          scripts/install-xmlsec1.sh
          "$XMLSEC1_BIN" --version
          echo "OPENSSL_BIN=$XMLSEC1_PREFIX/bin/openssl" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
      - name: Check FIPS provider without encryption
        if: matrix.native-fips
        run: cargo check --no-default-features --features aws-lc-fips,xml-backend-xmloxide
      - name: Lint FIPS provider configuration
        if: matrix.native-fips
        run: cargo clippy --all-targets ${{ matrix.cargo-args }} -- -D warnings
      - name: Lint experimental key establishment
        if: matrix.experimental-pq
        run: cargo clippy --all-targets ${{ matrix.cargo-args }} -- -D warnings
      - name: Qualify all-feature build and lint
        if: matrix.all-features
        run: |
          cargo build --workspace --all-features
          cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Exercise coexisting providers in disposable token storage
        if: matrix.all-features
        run: >-
          bash scripts/test-pkcs11.sh /usr/lib/softhsm/libsofthsm2.so
          --workspace --all-features -E 'not binary(libxslt_oracle)'
      - if: ${{ !matrix.all-features }}
        run: >-
          cargo nextest run --workspace ${{ matrix.cargo-args }}
          -E 'not binary(libxslt_oracle)'
      - run: cargo test --doc --workspace ${{ matrix.cargo-args }}

  test:
    runs-on: ubuntu-latest
    needs: [test-matrix, feature-contract, documentation, xslt-oracle, pkcs11, benchmark-contract, benchmark-comparison, security-corpus]
    if: ${{ always() }}
    steps:
      - run: test "${{ needs.test-matrix.result }}" = "success"
      - run: test "${{ needs.feature-contract.result }}" = "success"
      - run: test "${{ needs.documentation.result }}" = "success"
      - run: test "${{ needs.xslt-oracle.result }}" = "success"
      - run: test "${{ needs.pkcs11.result }}" = "success"
      - run: test "${{ needs.benchmark-contract.result }}" = "success"
      - run: test "${{ needs.benchmark-comparison.result }}" = "success"
      - run: test "${{ needs.security-corpus.result }}" = "success"

  xslt-oracle:
    name: XSLT oracle (libxslt 1.1.45)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Read pinned XSLT oracle revisions
        id: xslt-oracle-revisions
        run: |
          libxslt_commit="$(cat compatibility/libxslt-1.1.45-donor-commit.txt)"
          [[ "$libxslt_commit" =~ ^[0-9a-f]{40}$ ]]
          echo "libxslt=$libxslt_commit" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: GNOME/libxslt
          ref: ${{ steps.xslt-oracle-revisions.outputs.libxslt }}
          path: donors/libxslt
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.92.0"
      - uses: taiki-e/install-action@nextest
      - name: Verify vendored oracle fixtures
        env:
          LIBXSLT_SOURCE_DIR: ${{ github.workspace }}/donors/libxslt
        run: scripts/import-libxslt-oracle-fixtures.sh --check
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Check conformance admission and failure propagation
        run: node --test scripts/check-xslt-conformance.test.mjs
      - name: Provision pinned XML signature oracle
        run: |
          sudo apt-get update
          sudo apt-get install --yes autoconf automake build-essential curl libltdl-dev libssl-dev libtool libxml2-dev libxslt1-dev perl pkg-config
          bash scripts/install-xmlsec1.sh
      - name: Qualify XSLT engine, signature chains and failure contracts
        env:
          LIBXSLT_SOURCE_DIR: ${{ github.workspace }}/donors/libxslt
        run: bash scripts/check-xslt-conformance.sh
      - name: Check XSLT phase and concurrent reuse contracts
        env:
          LIBXSLT_SOURCE_DIR: ${{ github.workspace }}/donors/libxslt
        run: |
          sudo apt-get install --yes valgrind cmake zlib1g-dev liblzma-dev
          node --test scripts/benchmark-xslt.test.mjs
          cargo nextest run -p xml-sec-xslt --all-features --test phase_contract
          cargo clean
      - name: Measure XSLT phases against libxslt
        env:
          XSLT_BENCH_HEAP: '1'
          LIBXSLT_SOURCE_DIR: ${{ github.workspace }}/donors/libxslt
        run: |
          node scripts/benchmark-xslt.mjs "$RUNNER_TEMP/xslt-performance" 1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: xslt-performance
          path: ${{ runner.temp }}/xslt-performance
          if-no-files-found: error

  clippy-matrix:
    name: clippy (${{ matrix.xml-backend }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - xml-backend: xmloxide
            cargo-args: --no-default-features --features xmldsig,xmlenc,c14n,xml-backend-xmloxide
          - xml-backend: roxmltree
            cargo-args: --no-default-features --features xmldsig,xmlenc,c14n,xml-backend-roxmltree
          - xml-backend: differential
            cargo-args: --no-default-features --features xmldsig,xmlenc,c14n,xml-backend-differential
          - xml-backend: fat-runtime
            cargo-args: --no-default-features --features xmldsig,xmlenc,c14n,xml-backends-all
          - xml-backend: xslt-fat-runtime
            cargo-args: --no-default-features --features xmldsig,xmlenc,c14n,xml-backends-all,xslt
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets ${{ matrix.cargo-args }} -- -D warnings

  clippy:
    runs-on: ubuntu-latest
    needs: clippy-matrix
    if: ${{ always() }}
    steps:
      - run: test "${{ needs.clippy-matrix.result }}" = "success"

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path fuzz/Cargo.toml -- --check

  fuzz-campaign:
    uses: ./.github/workflows/fuzz.yml

  fuzz-smoke:
    runs-on: ubuntu-latest
    needs: fuzz-campaign
    if: ${{ always() }}
    steps:
      - env:
          RESULT: ${{ needs.fuzz-campaign.result }}
        run: test "$RESULT" = success
