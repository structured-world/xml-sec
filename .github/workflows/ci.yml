name: CI
on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  # RSA-PSS vectors always run; CI additionally requires reciprocal live checks.
  OPENSSL_BIN: openssl
  RUSTFLAGS: -Dwarnings
  XMLSEC1_PREFIX: ${{ github.workspace }}/.tools/xmlsec1-1.3.13
  XMLSEC1_BIN: ${{ github.workspace }}/.tools/xmlsec1-1.3.13/bin/xmlsec1
  LD_LIBRARY_PATH: ${{ github.workspace }}/.tools/xmlsec1-1.3.13/lib

jobs:
  hardening:
    name: native safety and dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.92.0"
          components: clippy
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.19.0
      - uses: ./.github/actions/rust-build-cache
        with:
          domain: ordinary
      - run: node --test scripts/check-hardening.test.mjs
      - run: node --test scripts/ci-test-blocks.test.mjs scripts/ci-cache.test.mjs scripts/security-corpus.test.mjs scripts/check-shared-pkix.test.mjs
      # The per-lint pedantic forbid list must match the pedantic group of both
      # lint toolchains, and a local allow of a listed lint must fail clippy.
      - run: rustup toolchain install stable --profile minimal --component clippy
      - run: node --test scripts/check-pedantic-lints.test.mjs
      - run: node scripts/check-pedantic-lints.mjs 1.92.0 stable
      - run: node scripts/security-corpus.mjs --check
      - run: bash scripts/check-hardening.sh dependencies
      - run: bash scripts/check-hardening.sh safety

  coverage:
    name: canonical line coverage (85%)
    runs-on: ubuntu-latest
    env:
      PKCS11_MODULE: /usr/lib/softhsm/libsofthsm2.so
      LIBXSLT_SOURCE_DIR: ${{ github.workspace }}/donors/libxslt
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Read pinned oracle revisions
        id: coverage-oracles
        run: |
          for donor in libxmlsec1-1.3.13 libxslt-1.1.45; do
            commit="$(cat compatibility/$donor-donor-commit.txt)"
            [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
            echo "$donor=$commit" >> "$GITHUB_OUTPUT"
          done
      - uses: actions/checkout@v7
        with:
          repository: lsh123/xmlsec
          ref: ${{ steps.coverage-oracles.outputs['libxmlsec1-1.3.13'] }}
          path: donors/xmlsec
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: GNOME/libxslt
          ref: ${{ steps.coverage-oracles.outputs['libxslt-1.1.45'] }}
          path: donors/libxslt
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.92.0"
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.8.5,cargo-nextest
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: ./.github/actions/rust-build-cache
        with:
          domain: coverage
          save: 'true'
      - uses: ./.github/actions/xmlsec-oracle-cache
        with:
          profile: modern
      - name: Provision independent oracles and disposable token support
        env:
          XMLSEC1_SOURCE_DIR: ${{ github.workspace }}/donors/xmlsec
          XMLSEC1_MODERN_ORACLE: "1"
        run: |
          sudo apt-get update
          sudo apt-get install --yes autoconf automake build-essential curl libltdl-dev libssl-dev libtool libxml2-dev libxslt1-dev perl pkg-config softhsm2 cmake zlib1g-dev liblzma-dev
          bash scripts/install-xmlsec1.sh
          echo "OPENSSL_BIN=$XMLSEC1_PREFIX/bin/openssl" >> "$GITHUB_ENV"
      - name: Execute every workspace target and enforce canonical coverage
        run: bash scripts/check-hardening.sh coverage "$RUNNER_TEMP/coverage"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: canonical-coverage
          path: ${{ runner.temp }}/coverage
          if-no-files-found: error

  feature-contract:
    name: feature contract (${{ matrix.rust }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    strategy:
      fail-fast: false
      matrix:
        include:
          - rust: "1.92.0"
            os: ubuntu-latest
            minimal: true
          - rust: stable
            os: ubuntu-latest
            minimal: true
          - rust: stable
            os: macos-latest
          - rust: stable
            os: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy
      - uses: taiki-e/install-action@nextest
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: ./.github/actions/rust-build-cache
        with:
          domain: ordinary
          toolchain: ${{ matrix.rust }}
          save: ${{ !matrix.minimal }}
      - name: Check the matrix runner
        if: runner.os != 'Windows'
        run: node --test scripts/check-features.test.mjs
      - name: Qualify actual core defaults
        shell: bash
        run: bash scripts/check-features.sh default
      - name: Provision isolated token provider
        if: matrix.minimal
        run: sudo apt-get update && sudo apt-get install -y softhsm2
      - name: Qualify isolated minimal feature graphs
        if: matrix.minimal
        env:
          PKCS11_MODULE: /usr/lib/softhsm/libsofthsm2.so
        run: |
          for profile in dom-xmloxide dom-roxmltree c14n-xmloxide c14n-roxmltree dsig-xmloxide dsig-roxmltree xmlenc-xmloxide xmlenc-roxmltree xslt legacy experimental fips-dsig pkcs11 no-backend; do
            echo "::group::$profile"
            bash scripts/check-features.sh "$profile"
            echo '::endgroup::'
          done
      - name: Qualify documentation and executable examples
        if: matrix.minimal
        run: |
          node --test scripts/check-documentation.test.mjs
          bash scripts/check-documentation.sh
      - name: Qualify benchmark contracts and lint
        if: matrix.minimal
        run: |
          cargo nextest run --test benchmark_contract --example benchmark_latency --features benchmark-internals
          cargo clippy --bench security --example benchmark_latency --features benchmark-internals,benchmark-alloc -- -D warnings
          node --test scripts/compare-security.test.mjs
      - name: Exercise measurement runner (not a performance threshold)
        if: matrix.minimal
        run: bash scripts/benchmark-security.sh "$RUNNER_TEMP/benchmark-smoke-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" 1
      - uses: actions/upload-artifact@v7
        if: matrix.minimal
        with:
          name: benchmark-smoke-${{ matrix.rust }}-rustcrypto
          path: ${{ runner.temp }}/benchmark-smoke-${{ github.run_id }}-${{ github.run_attempt }}

  benchmark-comparison:
    uses: ./.github/workflows/benchmark-comparison.yml

  pkcs11:
    name: PKCS11 backend contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.92.0"
          components: clippy
      - uses: taiki-e/install-action@nextest
      - uses: ./.github/actions/rust-build-cache
        with:
          domain: ordinary
      - name: Install isolated token oracle
        run: sudo apt-get update && sudo apt-get install -y softhsm2
      - name: Check optional provider
        run: |
          for backend in xmloxide roxmltree differential; do
            echo "::group::PKCS11 $backend"
            cargo clippy --no-default-features --features "pkcs11,c14n,xml-backend-$backend" --all-targets -- -D warnings
            cargo nextest run --lib --no-default-features --features "pkcs11,c14n,xml-backend-$backend"
            cargo nextest run -p xml-sec-config --no-default-features --features "pkcs11,xml-backend-$backend"
            bash scripts/test-pkcs11.sh /usr/lib/softhsm/libsofthsm2.so --no-default-features --features "c14n,xml-backend-$backend"
            echo '::endgroup::'
          done

  capability-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Read pinned donor revision
        id: donor-revision
        run: |
          commit="$(cat compatibility/libxmlsec1-1.3.13-donor-commit.txt)"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: lsh123/xmlsec
          ref: ${{ steps.donor-revision.outputs.commit }}
          path: donors/xmlsec
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.92.0"
          components: rustfmt
      - uses: ./.github/actions/rust-build-cache
        with:
          domain: ordinary
      - name: Check native CLI upstream fixture snapshot
        run: scripts/import-xmlsec1-cli-fixtures.sh --check
      - name: Check maintained XML parser kernels and the vendored ML-DSA
        run: |
          bash scripts/import-xml-backends.sh roxmltree --verify
          bash scripts/import-xml-backends.sh xmloxide --verify
          bash scripts/import-rustcrypto-ml-dsa.sh --verify
      - run: >-
          cargo run -p xml-sec-capability-ledger -- check
          donors/xmlsec
          compatibility/libxmlsec1-1.3.13-rules.json
          compatibility/libxmlsec1-1.3.13.json
      - run: >-
          cargo run -p xml-sec-capability-ledger -- behavior-check
          donors/xmlsec
          compatibility/libxmlsec1-1.3.13-behavior-rules.json
          compatibility/libxmlsec1-1.3.13-behavior.json

  build:
    runs-on: ubuntu-latest
    needs: test-matrix
    if: ${{ always() }}
    steps:
      - run: test "${{ needs.test-matrix.result }}" = "success"

  alloc-only:
    name: alloc-only XML input
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.92.0"
          targets: thumbv7em-none-eabihf,wasm32-unknown-unknown
          components: clippy
      - uses: ./.github/actions/rust-build-cache
        with:
          domain: alloc-targets
          save: 'true'
      - run: cargo +1.92.0 clippy -p xml-sec-xml-input --lib --no-default-features -- -D warnings
      - run: >-
          cargo +1.92.0 check -p xml-sec-xml-input --no-default-features
          --target thumbv7em-none-eabihf
      - run: bash scripts/check-shared-pkix.sh
        env:
          RUSTUP_TOOLCHAIN: "1.92.0"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: bash scripts/test-wasm-c14n.sh
        env:
          RUSTUP_TOOLCHAIN: "1.92.0"

  test-matrix:
    name: test block (${{ matrix.block }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    strategy:
      fail-fast: false
      matrix:
        include:
          - block: stable-core
            rust: stable
          - block: msrv-core
            rust: "1.92.0"
          - block: msrv-extended
            rust: "1.92.0"
            token: true
          - block: stable-extended
            rust: stable
            token: true
          - block: msrv-fips
            rust: "1.92.0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Read pinned donor revision
        id: test-donor-revision
        run: |
          commit="$(cat compatibility/libxmlsec1-1.3.13-donor-commit.txt)"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: lsh123/xmlsec
          ref: ${{ steps.test-donor-revision.outputs.commit }}
          path: donors/xmlsec
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy
      - uses: taiki-e/install-action@nextest
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Refresh apt package index
        run: sudo apt-get update
      - name: Provision all-feature token tests
        if: matrix.token
        run: sudo apt-get install -y softhsm2
      - uses: ./.github/actions/xmlsec-oracle-cache
        with:
          profile: modern
      - name: Build pinned xmlsec1 for external-oracle tests
        env:
          XMLSEC1_SOURCE_DIR: ${{ github.workspace }}/donors/xmlsec
          XMLSEC1_MODERN_ORACLE: "1"
        run: |
          sudo apt-get install --yes autoconf automake build-essential curl libltdl-dev libssl-dev libtool libxml2-dev libxslt1-dev perl pkg-config
          scripts/install-xmlsec1.sh
          "$XMLSEC1_BIN" --version
          echo "OPENSSL_BIN=$XMLSEC1_PREFIX/bin/openssl" >> "$GITHUB_ENV"
      - uses: ./.github/actions/rust-build-cache
        with:
          domain: ordinary
          toolchain: ${{ matrix.rust }}
          # One complete dependency graph per compiler owns writes, not a race
          # between partial feature matrices for the same immutable entry.
          save: ${{ matrix.block == 'msrv-extended' || matrix.block == 'stable-extended' }}
      - name: Qualify isolated build, lint, tests and doctests
        env:
          PKCS11_MODULE: /usr/lib/softhsm/libsofthsm2.so
          BLOCK: ${{ matrix.block }}
        run: node scripts/ci-test-blocks.mjs "$BLOCK"
      - name: Qualify FIPS benchmark contracts and measurement runner
        if: matrix.block == 'msrv-fips'
        run: |
          cargo nextest run --test benchmark_contract --example benchmark_latency --features benchmark-internals,aws-lc-fips
          cargo clippy --bench security --example benchmark_latency --features benchmark-internals,aws-lc-fips,benchmark-alloc -- -D warnings
          node --test scripts/compare-security.test.mjs
          bash scripts/benchmark-security.sh "$RUNNER_TEMP/benchmark-smoke-fips-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" 1 aws-lc-fips
      - uses: actions/upload-artifact@v7
        if: matrix.block == 'msrv-fips'
        with:
          name: benchmark-smoke-1.92.0-aws-lc-fips
          path: ${{ runner.temp }}/benchmark-smoke-fips-${{ github.run_id }}-${{ github.run_attempt }}

  test:
    runs-on: ubuntu-latest
    needs: [test-matrix, feature-contract, xslt-oracle, pkcs11, benchmark-comparison, capability-ledger, build, alloc-only, clippy, fmt, fuzz-smoke, hardening, coverage]
    if: ${{ always() }}
    steps:
      - run: test "${{ needs.test-matrix.result }}" = "success"
      - run: test "${{ needs.feature-contract.result }}" = "success"
      - run: test "${{ needs.xslt-oracle.result }}" = "success"
      - run: test "${{ needs.pkcs11.result }}" = "success"
      - run: test "${{ needs.benchmark-comparison.result }}" = "success"
      - run: test "${{ needs.capability-ledger.result }}" = "success"
      - run: test "${{ needs.build.result }}" = "success"
      - run: test "${{ needs.alloc-only.result }}" = "success"
      - run: test "${{ needs.clippy.result }}" = "success"
      - run: test "${{ needs.fmt.result }}" = "success"
      - run: test "${{ needs.fuzz-smoke.result }}" = "success"
      - run: test "${{ needs.hardening.result }}" = "success"
      - run: test "${{ needs.coverage.result }}" = "success"

  xslt-oracle:
    name: XML interoperability oracles
    runs-on: ubuntu-latest
    env:
      JAVA_HOME: /usr/lib/jvm/java-21-openjdk-amd64
      PYTHONDONTWRITEBYTECODE: "1"
      RUSTUP_TOOLCHAIN: "1.92.0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Read pinned XSLT oracle revisions
        id: xslt-oracle-revisions
        run: |
          libxslt_commit="$(cat compatibility/libxslt-1.1.45-donor-commit.txt)"
          [[ "$libxslt_commit" =~ ^[0-9a-f]{40}$ ]]
          echo "libxslt=$libxslt_commit" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: GNOME/libxslt
          ref: ${{ steps.xslt-oracle-revisions.outputs.libxslt }}
          path: donors/libxslt
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.92.0"
      - uses: taiki-e/install-action@nextest
      - name: Verify vendored oracle fixtures
        env:
          LIBXSLT_SOURCE_DIR: ${{ github.workspace }}/donors/libxslt
        run: scripts/import-libxslt-oracle-fixtures.sh --check
      - uses: ./.github/actions/rust-build-cache
        with:
          domain: ordinary
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Check conformance admission and failure propagation
        run: node --test scripts/check-xslt-conformance.test.mjs
      - uses: ./.github/actions/xmlsec-oracle-cache
        with:
          profile: legacy
      - name: Provision pinned XML signature oracle
        run: |
          sudo apt-get update
          sudo apt-get install --yes autoconf automake build-essential curl libltdl-dev libssl-dev libtool libxml2-dev libxslt1-dev perl pkg-config openjdk-21-jdk
          bash scripts/install-xmlsec1.sh
      - name: Verify live XMLDSig and XAdES corpus results
        run: python3 scripts/check-xades-interop.py --output "$RUNNER_TEMP/xades-interop"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: xades-interop-results
          path: ${{ runner.temp }}/xades-interop
          if-no-files-found: error
      - name: Qualify XSLT engine, signature chains and failure contracts
        env:
          LIBXSLT_SOURCE_DIR: ${{ github.workspace }}/donors/libxslt
        run: bash scripts/check-xslt-conformance.sh --cache-managed
      - name: Check XSLT phase and concurrent reuse contracts
        env:
          LIBXSLT_SOURCE_DIR: ${{ github.workspace }}/donors/libxslt
        run: |
          sudo apt-get install --yes valgrind cmake zlib1g-dev liblzma-dev
          node --test scripts/benchmark-xslt.test.mjs
          cargo nextest run -p xml-sec-xslt --all-features --test phase_contract
      - name: Measure XSLT phases against libxslt
        env:
          XSLT_BENCH_HEAP: '1'
          CARGO_TARGET_DIR: ${{ runner.temp }}/xslt-measurement
          LIBXSLT_SOURCE_DIR: ${{ github.workspace }}/donors/libxslt
        run: |
          node scripts/benchmark-xslt.mjs "$RUNNER_TEMP/xslt-performance" 1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: xslt-performance
          path: ${{ runner.temp }}/xslt-performance
          if-no-files-found: error

  clippy:
    runs-on: ubuntu-latest
    needs: test-matrix
    if: ${{ always() }}
    steps:
      - run: test "${{ needs.test-matrix.result }}" = "success"

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path fuzz/Cargo.toml -- --check

  fuzz-campaign:
    uses: ./.github/workflows/fuzz.yml

  fuzz-smoke:
    runs-on: ubuntu-latest
    needs: fuzz-campaign
    if: ${{ always() }}
    steps:
      - env:
          RESULT: ${{ needs.fuzz-campaign.result }}
        run: test "$RESULT" = success
