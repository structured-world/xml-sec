[package]
name = "xml-sec-competitor-bench"
version = "0.0.0"
edition = "2024"
publish = false
description = "In-process library comparison of xml-sec and Bergshamra; never a dependency of xml-sec."
license = "Apache-2.0 AND MIT"
rust-version = "1.92"

# A workspace of its own: the competitor and its lockfile stay out of the product
# dependency graph, and `cargo tree` of the xml-sec workspace never reaches them.
[workspace]

[[bin]]
name = "xml-sec-library"
path = "src/bin/xml_sec_library.rs"

[[bin]]
name = "bergshamra-library"
path = "src/bin/bergshamra_library.rs"

[features]
# Counts heap work in a separate build; its timings are never reported.
allocation-profile = []

[dependencies]
xml-sec = { path = "../..", features = ["xslt"] }
rsa = { package = "sad-rsa", version = "0.10.2", default-features = false }
pem = "4"
serde_json = "1"
# The competitor's current code: each comparison run moves these to the
# commit its command-line build uses, and records that commit.
bergshamra-dsig = { git = "https://github.com/kushaldas/bergshamra.git", default-features = false, features = ["rustcrypto"] }
bergshamra-enc = { git = "https://github.com/kushaldas/bergshamra.git", default-features = false, features = ["rustcrypto"] }
bergshamra-keys = { git = "https://github.com/kushaldas/bergshamra.git", default-features = false, features = ["rustcrypto"] }
uppsala = "0.12"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.release]
debug = 1
