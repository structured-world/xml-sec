[package]
name = "xml-sec-wasm-smoke"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
xml-sec = { path = "../..", default-features = false, features = ["c14n", "cms", "xml-backend-roxmltree"] }
xml-sec-xades = { path = "../../crates/xml-sec-xades", default-features = false, features = ["xml-backend-roxmltree"] }
structured-asn1 = { version = "0.20.0", default-features = false, features = ["alloc"] }
structured-cms = { version = "0.20.0", default-features = false, features = ["alloc"] }
structured-pkix = { version = "0.20.0", default-features = false, features = ["alloc"] }
