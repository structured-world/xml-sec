[package]
name = "xml-sec"
version = "0.4.0"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0 AND MIT"
description = "Pure Rust XML Security: XMLDSig, XMLEnc, C14N with explicit policy and providers."
repository = "https://github.com/structured-world/xml-sec"
homepage = "https://github.com/structured-world/xml-sec"
documentation = "https://docs.rs/xml-sec"
keywords = ["xml", "xmldsig", "xmlenc", "c14n", "saml"]
categories = ["cryptography", "web-programming", "authentication"]
readme = "README.md"
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/LICENSE",
    "/LICENSE-THIRD-PARTY",
    "/README.md",
    "/assets/usdt-qr.svg",
    "/docs/**",
    "/src/**",
    "/examples/**",
    "/benches/**",
    "/benchmarks/dashboard/**",
    "/benchmarks/Dockerfile",
    "/tests/**",
    # These read files of sibling packages, which Cargo never packages; they run
    # in the workspace.
    "!/tests/capability_ledger.rs",
    "!/tests/donor_negative_vectors.rs",
    "!/tests/opc_relationship_transform.rs",
    "/compatibility/**",
    "/scripts/**",
]

[workspace]
members = [
    ".",
    "crates/xml-sec-xml-input",
    "crates/xml-sec-xslt",
    "tools/capability-ledger",
    "tools/xml-sec-tools",
    "crates/xml-sec-config",
    "crates/xml-sec-xades",
    "tools/xmlsec1",
    "vendor/sxd-document-no-unsafe",
    "vendor/sxd-xpath-no-unsafe",
]
resolver = "3"

# Every member inherits one lint contract, so each existing clippy run in CI
# enforces it on its own toolchain and feature graph.
[workspace.lints.rust]
# Sources shared through `#[path]` test features that only some members declare.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("embedded", "raw-pointer-backend", "__internal_expose_string_pool"))'] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Every pedantic lint is forbidden by name, so a local `#[allow]` or `#[expect]`
# of one is error E0453. Forbidding the group would not do that: rustc lets a
# member allow override a forbidden group (`forbidden_lint_groups`).
# The list is the pedantic group of stable clippy; the `pedantic-lints` command
# of xml-sec-tools keeps it complete. One is left out and the same check rejects any source that
# allows it: `used_underscore_binding`, which thiserror's derive allows in its
# expansion.
assert_is_empty = "forbid"
assigning_clones = "forbid"
bool_to_int_with_if = "forbid"
borrow_as_ptr = "forbid"
case_sensitive_file_extension_comparisons = "forbid"
cast_lossless = "forbid"
cast_possible_truncation = "forbid"
cast_possible_wrap = "forbid"
cast_precision_loss = "forbid"
cast_ptr_alignment = "forbid"
cast_sign_loss = "forbid"
checked_conversions = "forbid"
cloned_instead_of_copied = "forbid"
collapsible_else_if = "forbid"
comparison_chain = "forbid"
copy_iterator = "forbid"
decimal_bitwise_operands = "forbid"
default_trait_access = "forbid"
doc_broken_link = "forbid"
doc_comment_double_space_linebreaks = "forbid"
doc_link_with_quotes = "forbid"
doc_markdown = "forbid"
duration_suboptimal_units = "forbid"
elidable_lifetime_names = "forbid"
enum_glob_use = "forbid"
expl_impl_clone_on_copy = "forbid"
explicit_deref_methods = "forbid"
explicit_into_iter_loop = "forbid"
explicit_iter_loop = "forbid"
filter_map_next = "forbid"
flat_map_option = "forbid"
float_cmp = "forbid"
fn_params_excessive_bools = "forbid"
format_collect = "forbid"
format_push_string = "forbid"
if_not_else = "forbid"
ignore_without_reason = "forbid"
ignored_unit_patterns = "forbid"
implicit_clone = "forbid"
implicit_hasher = "forbid"
inconsistent_struct_constructor = "forbid"
index_refutable_slice = "forbid"
inefficient_to_string = "forbid"
inline_always = "forbid"
into_iter_without_iter = "forbid"
invalid_upcast_comparisons = "forbid"
ip_constant = "forbid"
items_after_statements = "forbid"
iter_filter_is_ok = "forbid"
iter_filter_is_some = "forbid"
iter_not_returning_iterator = "forbid"
iter_without_into_iter = "forbid"
large_digit_groups = "forbid"
large_futures = "forbid"
large_stack_arrays = "forbid"
large_types_passed_by_value = "forbid"
linkedlist = "forbid"
macro_use_imports = "forbid"
manual_assert = "forbid"
manual_assert_eq = "forbid"
manual_bit_width = "forbid"
manual_ilog2 = "forbid"
manual_instant_elapsed = "forbid"
manual_is_power_of_two = "forbid"
manual_is_variant_and = "forbid"
manual_let_else = "forbid"
manual_midpoint = "forbid"
manual_string_new = "forbid"
many_single_char_names = "forbid"
map_unwrap_or = "forbid"
match_bool = "forbid"
match_same_arms = "forbid"
match_wild_err_arm = "forbid"
match_wildcard_for_single_variants = "forbid"
maybe_infinite_iter = "forbid"
mismatching_type_param_order = "forbid"
missing_errors_doc = "forbid"
missing_fields_in_debug = "forbid"
missing_panics_doc = "forbid"
must_use_candidate = "forbid"
mut_mut = "forbid"
naive_bytecount = "forbid"
needless_bitwise_bool = "forbid"
needless_continue = "forbid"
needless_for_each = "forbid"
needless_pass_by_value = "forbid"
needless_raw_string_hashes = "forbid"
no_effect_underscore_binding = "forbid"
no_mangle_with_rust_abi = "forbid"
non_std_lazy_statics = "forbid"
nonminimal_bool = "forbid"
option_as_ref_cloned = "forbid"
option_option = "forbid"
overly_complex_bool_expr = "forbid"
ptr_as_ptr = "forbid"
ptr_cast_constness = "forbid"
ptr_offset_by_literal = "forbid"
pub_underscore_fields = "forbid"
range_minus_one = "forbid"
range_plus_one = "forbid"
redundant_closure_for_method_calls = "forbid"
redundant_else = "forbid"
ref_as_ptr = "forbid"
ref_binding_to_reference = "forbid"
ref_option = "forbid"
ref_option_ref = "forbid"
return_self_not_must_use = "forbid"
same_functions_in_if_condition = "forbid"
same_length_and_capacity = "forbid"
self_only_used_in_recursion = "forbid"
semicolon_if_nothing_returned = "forbid"
should_panic_without_expect = "forbid"
similar_names = "forbid"
single_char_pattern = "forbid"
single_match_else = "forbid"
stable_sort_primitive = "forbid"
str_split_at_newline = "forbid"
string_add_assign = "forbid"
struct_excessive_bools = "forbid"
struct_field_names = "forbid"
too_many_lines = "forbid"
transmute_ptr_to_ptr = "forbid"
trivially_copy_pass_by_ref = "forbid"
unchecked_time_subtraction = "forbid"
unicode_not_nfc = "forbid"
uninlined_format_args = "forbid"
unnecessary_box_returns = "forbid"
unnecessary_debug_formatting = "forbid"
unnecessary_join = "forbid"
unnecessary_literal_bound = "forbid"
unnecessary_semicolon = "forbid"
unnecessary_trailing_comma = "forbid"
unnecessary_wraps = "forbid"
unnested_or_patterns = "forbid"
unreadable_literal = "forbid"
unsafe_derive_deserialize = "forbid"
unused_async = "forbid"
unused_async_trait_impl = "forbid"
unused_self = "forbid"
used_underscore_items = "forbid"
verbose_bit_mask = "forbid"
wildcard_imports = "forbid"
with_capacity_zero = "forbid"
zero_sized_map_values = "forbid"

# The complete libxslt oracle includes multi-megabyte DocBook transforms. Keep
# production-equivalent XSLT/XPath code generation in the test profile so the
# per-case watchdog measures algorithmic stalls rather than debug arithmetic.
[profile.dev.package.xml-sec-xslt]
opt-level = 2

[profile.dev.package.xml-sec-sxd-document]
opt-level = 2

[profile.dev.package.xml-sec-sxd-xpath]
opt-level = 2

[[test]]
name = "xmlsec1_interop"
path = "tests/xmlsec1_interop.rs"
required-features = ["xmldsig-sign", "c14n"]

[[test]]
name = "signing_digest"
required-features = ["xmldsig-sign", "c14n"]

[[test]]
name = "signature_pipeline_integration"
required-features = ["xmldsig"]

[[test]]
name = "donor_negative_vectors"
required-features = ["xmldsig"]

[[test]]
name = "xpath_transform_integration"
required-features = ["xmldsig-sign", "c14n"]

[[test]]
name = "base64_transform_integration"
required-features = ["xmldsig-sign", "c14n"]

[[test]]
name = "xslt_transform_integration"
required-features = ["xslt", "xmldsig-sign", "c14n"]

[[test]]
name = "merlin_interop"
required-features = ["xmldsig"]

[[test]]
name = "uri_integration"
required-features = ["xmldsig", "c14n"]

[[test]]
name = "xmlenc11_corpus"
required-features = ["xmlenc", "c14n", "legacy-algorithms"]

[[example]]
name = "encrypt"
required-features = ["xmlenc"]

[[example]]
name = "sign"
required-features = ["xmldsig-sign", "c14n"]

[[example]]
name = "verify"
required-features = ["xmldsig"]

[[example]]
name = "policy_roundtrip"
required-features = ["xmlenc"]

[[bench]]
name = "security"
harness = false
required-features = ["benchmark-internals"]

[[example]]
name = "benchmark_latency"
required-features = ["benchmark-internals"]

[dependencies]
# XML parsing
# The maintained parser kernels are embedded; memchr is roxmltree's existing
# tokenizer dependency, not an alternate parsing engine.
memchr = { version = "2", default-features = false, optional = true }
self_cell = "1.3"
encoding_rs = { version = "0.8", default-features = false, features = ["alloc"] }
xmlparser = { version = "0.13.6", default-features = false }
# XPath floor/ceiling without std, where core has no float rounding.
libm = { version = "0.2.16", optional = true }
# The XPath tokenizer's parser combinators.
winnow ={ version = "1.0.4", default-features = false, features = ["parser"], optional = true }
snafu = { version = "0.9", default-features = false, features = ["rust_1_81"], optional = true }

# Crypto
cryptoki = { version = "0.12.1", optional = true }
aws-lc-rs = { version = "1.19", default-features = false, features = ["fips"], optional = true }
rsa = { package = "sad-rsa", version = "0.10.2", default-features = false, features = ["sha1", "sha2", "hazmat"], optional = true }
sha1 = { version = "0.11", features = ["oid", "zeroize"], optional = true }
sha2 = { version = "0.11", features = ["oid", "zeroize"], optional = true }
# Dependencies of the embedded RustCrypto SHA-3 bit-tail adaptation.
keccak = { version = "0.2", default-features = false, optional = true }
sponge-cursor = { version = "0.1", default-features = false, features = ["zeroize"], optional = true }
camellia = { version = "0.2.1", default-features = false, features = ["zeroize"], optional = true }
chacha20 = { version = "0.10.2", default-features = false, features = ["zeroize"], optional = true }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc"], optional = true }
ed448-goldilocks = { version = "=0.14.0-pre.15", default-features = false, features = ["alloc", "signing", "pkcs8"], optional = true }
# Dependencies of the embedded, patched RustCrypto ML-DSA implementation.
common = { package = "crypto-common", version = "0.2", default-features = false, features = ["rand_core"], optional = true }
ctutils = { version = "0.4", default-features = false, optional = true }
hybrid-array = { version = "0.4", default-features = false, features = ["extra-sizes", "alloc", "zeroize"], optional = true }
module-lattice = { version = "0.2.3", default-features = false, features = ["ctutils", "alloc", "zeroize"], optional = true }
shake = { version = "0.1", default-features = false, optional = true }
const-oid = { version = "0.10", default-features = false, features = ["db"], optional = true }
slh-dsa = { version = "=0.2.0-rc.5", default-features = false, features = ["alloc", "zeroize"], optional = true }
ml-kem = { version = "0.3.2", default-features = false, features = ["alloc", "zeroize"], optional = true }
# Without the curves' `std`/`getrandom`: every random draw goes through the
# selected CryptoProvider, so no build carries an operating-system RNG here.
p256 = { version = "0.14", default-features = false, features = ["alloc", "ecdsa", "pem"], optional = true }
p384 = { version = "0.14", default-features = false, features = ["alloc", "ecdsa", "pem"], optional = true }
p521 = { version = "0.14", default-features = false, features = ["alloc", "ecdsa", "pem"], optional = true }
# Only lets `std` select the curves' lazily built basepoint tables, which the
# curves' own `std` would couple to `getrandom`; no API of this crate is used.
primeorder = { version = "0.14", default-features = false, optional = true }
dsa = { version = "0.7", features = ["hazmat"], optional = true }
pkcs8 = { version = "0.11", features = ["pem"], optional = true }
pkcs1 = { version = "0.8.0-rc.5", default-features = false, features = ["alloc", "pem"], optional = true }
ed25519-dalek = { version = "3", default-features = false, features = ["alloc", "digest", "fast", "hazmat", "pkcs8", "zeroize"], optional = true }
# Expose the same curve primitive already used by dalek for RFC 8032 Ed25519ctx.
curve25519-dalek = { version = "5", default-features = false, features = ["alloc", "precomputed-tables", "zeroize"], optional = true }
hmac = { version = "0.13", features = ["zeroize"], optional = true }
hkdf = { version = "0.13", default-features = false, optional = true }
x25519-dalek = { version = "3", default-features = false, features = ["static_secrets", "zeroize"], optional = true }
x448 = { version = "=0.14.0-pre.12", default-features = false, features = ["static_secrets"], optional = true }
signature = { version = "3", optional = true }
subtle = { version = "2", default-features = false, optional = true }
getrandom = { version = "0.4", features = ["sys_rng"], optional = true }
zeroize = { version = "1", optional = true }
aes = { version = "0.9.2", optional = true }
aes-gcm = { version = "0.11.1", optional = true }
aes-kw = { version = "0.3.1", optional = true }
cbc = { version = "0.2.1", optional = true }
des = { version = "0.9", optional = true }
md-5 = { version = "0.11", features = ["oid", "zeroize"], optional = true }
ripemd = { version = "0.2.0", default-features = false, features = ["oid", "zeroize"], optional = true }
pkcs12 = { version = "=0.2.0-pre.0", default-features = false, features = ["kdf"], optional = true }
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"], optional = true }

# X.509 certificates
structured-asn1 = { version = "0.20.0", default-features = false, features = ["alloc"], optional = true }
structured-pkix = { version = "0.20.0", default-features = false, features = ["alloc"], optional = true }
# PKCS#12 container framing; this crate keeps the password, KDF and cipher work.
structured-cms = { version = "0.20.0", default-features = false, features = ["alloc"], optional = true }
tinyvec = { version = "1.13", optional = true }
# `pem` is RFC 7468 decoding of caller key and certificate text.
der = { version = "0.8", default-features = false, features = ["alloc", "pem"], optional = true }
crypto-bigint = { version = "0.7", features = ["zeroize"], optional = true }
crypto-primes = { version = "0.7.2", default-features = false, optional = true }

# Dependencies of the embedded XSLT 1.0 engine (src/xslt).
icu_collator = { version = "2.3.1", optional = true }
icu_locale = { version = "2.3.1", optional = true }
roxmltree = { version = "0.21", features = ["positions"], optional = true }
time = { version = "0.3.55", features = ["local-offset"], optional = true }
url = { version = "2", optional = true }

# Base64 encoding/decoding
base64 = { version = "0.23", default-features = false, features = ["alloc"] }

# Error handling
thiserror = { version = "2", default-features = false }

# The process-wide document identity counter on targets without 64-bit atomics.
[target.'cfg(not(target_has_atomic = "64"))'.dependencies]
portable-atomic = { version = "1.15", default-features = false, features = ["fallback"] }

[dev-dependencies]
# The embedded XPath engine's tests build documents with its XML parser.
peresil = "0.3"
sha3 = { version = "0.12", default-features = false, features = ["oid", "zeroize"] }
divan = "=0.1.21"
ml-dsa = { version = "0.1.1", default-features = false, features = ["alloc", "pkcs8", "rand_core", "zeroize"] }
hex-literal = "1"
roxmltree = { version = "0.21", features = ["positions"] }
rcgen = "0.14.6"
# Test-only certificate/CRL construction and independent reading; production
# parsing uses structured-pkix and RFC 7468 decoding through `der`.
x509-cert = { version = "0.3", default-features = false }
x509-parser = "0.18"
pem = "4"
# The vendored ML-DSA tests draw random polynomials in every feature set.
getrandom = { version = "0.4", features = ["sys_rng"] }
rand_chacha = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = "0.3.55"
tempfile = "3"

[features]
# Measurement hooks only; no checks are bypassed and no timers run in production.
benchmark-internals = ["xmldsig", "xmlenc", "c14n", "xml-backends-all"]
benchmark-alloc = ["benchmark-internals"]
legacy-algorithms = ["dep:ripemd", "dep:md-5", "dep:des"]
default = ["std", "xmldsig", "xmldsig-sign", "xmlenc", "c14n", "xml-backend-xmloxide"]
std = [
    "thiserror/std",
    "xmlparser/std",
    "structured-asn1?/std",
    "structured-pkix?/std",
    "structured-cms?/std",
    "base64/std",
    "snafu?/std",
    "der?/std",
    "subtle?/std",
    # Lazily built basepoint tables need std's LazyLock without critical-section.
    "primeorder?/std",
    "p256?/precomputed-tables",
    "p384?/precomputed-tables",
    "p521?/precomputed-tables",
]
aws-lc-fips = ["std", "xmldsig", "dep:aws-lc-rs"]
pkcs11 = ["std", "xmlenc", "dep:cryptoki"]
xml-backend-xmloxide = []
xml-backend-roxmltree = ["dep:memchr"]
xml-backends-all = ["xml-backend-xmloxide", "xml-backend-roxmltree"]
# Compatibility alias for existing CI/fuzz builds. Unlike `xml-backends-all`,
# this also selects differential parsing as the default runtime mode.
xml-backend-differential = ["xml-backends-all"]
xmldsig = [            # XML Digital Signature verification and public-key inventory
    "no-unsafe",
    "embedded",
    "dep:der",
    "dep:crypto-bigint",
    "dep:dsa",
    "dep:ed25519-dalek",
    "dep:curve25519-dalek",
    "dep:ed448-goldilocks",
    "dep:hmac",
    "dep:md-5",
    "dep:winnow",
    "dep:libm",
    "dep:p256",
    "dep:p384",
    "dep:p521",
    "dep:primeorder",
    "dep:pkcs8",
    "dep:pkcs1",
    "dep:rsa",
    "dep:sha1",
    "dep:sha2",
    "dep:keccak",
    "dep:sponge-cursor",
    "dep:signature",
    "dep:snafu",
    "dep:subtle",
    "dep:structured-asn1",
    "dep:structured-pkix",
    "dep:tinyvec",
    "dep:zeroize",
]
# CMS SignedData and RFC 3161 timestamp signatures through the selected provider.
cms = ["xmldsig", "dep:structured-cms"]
# Signing, signing randomness and private-key import (PEM/PKCS#8, encrypted
# PKCS#8, PKCS#12) on top of verification.
xmldsig-sign = [
    "xmldsig",
    # Signing randomness and the signature writer need the host.
    "std",
    "dep:getrandom",
    "dep:pkcs12",
    "dep:structured-cms",
    "dep:pbkdf2",
    "dep:aes",
    "dep:cbc",
    "dep:des",
    # The signer's DSA KeyValue writer derives its parameter encoder.
    "der/derive",
    "pkcs8/encryption",
]
xmlenc = [             # XML Encryption (encrypt + decrypt)
    "std",
    # The shared key inventory stores XMLDSig KeyInfo for named RSA recipients,
    # and decryption reads private keys.
    "xmldsig-sign",
    "dep:aes",
    "dep:aes-gcm",
    "dep:aes-kw",
    "dep:cbc",
    "dep:camellia",
    "dep:chacha20",
    "dep:chacha20poly1305",
    "dep:getrandom",
    "dep:rsa",
    "dep:sha1",
    "dep:sha2",
    "dep:hkdf",
    "dep:x25519-dalek",
    "dep:x448",
    "dep:crypto-primes",
    "p256/ecdh",
    "p384/ecdh",
    "p521/ecdh",
]
c14n = []              # XML Canonicalization (inclusive + exclusive)
# XMLDSig XSLT transform (http://www.w3.org/TR/1999/REC-xslt-19991116); its
# engine shares state across threads and reads the host clock, so it needs std.
xslt = ["xmldsig", "std", "dep:icu_collator", "dep:icu_locale", "dep:roxmltree", "dep:time", "dep:url"]
# Experimental libxmlsec1 algorithm identifiers; build capability is not policy permission.
experimental-pq = ["xmldsig", "der/derive", "dep:slh-dsa", "dep:ml-kem", "dep:common", "dep:ctutils", "dep:hybrid-array", "dep:module-lattice", "dep:shake", "dep:const-oid", "signature/digest", "signature/alloc", "signature/rand_core"]
no-unsafe = []
embedded = []

[lints]
workspace = true
