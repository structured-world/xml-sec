[package]
name = "xml-sec-sxd-document"
version = "0.1.0"
authors = ["Jake Goulding <jake.goulding@gmail.com>", "Neil Soiffer <soiffer@alum.mit.edu>"]
edition = "2024"

description = "Maintained safe-Rust XML DOM for xml-sec XPath and XSLT"
readme = "README.md"
keywords = ["xml"]

repository = "https://github.com/structured-world/xml-sec"
documentation = "https://docs.rs/xml-sec-sxd-document"

license = "MIT"

[features]
default = []
__internal_expose_string_pool = []
no-unsafe = []

[lib]
name = "sxd_document_no_unsafe"
path = "src/lib.rs"

[dependencies]
peresil = "0.3.0"
typed-arena = "2.0"
