[package]
name = "xml-sec-sxd-document"
version = "0.1.0"
publish = false
authors = ["Jake Goulding <jake.goulding@gmail.com>", "Neil Soiffer <soiffer@alum.mit.edu>"]
edition = "2024"

description = "Maintained safe-Rust XML DOM for xml-sec XPath and XSLT"
readme = "README.md"
keywords = ["xml"]

repository = "https://github.com/structured-world/xml-sec"
documentation = "https://docs.rs/xml-sec-sxd-document"

license = "MIT"

[features]
default = ["no-unsafe"]
__internal_expose_string_pool = []
no-unsafe = []
# Cargo features are additive. Disable defaults when selecting this backend; enabling both keeps
# the safe backend so workspace `--all-features` remains a valid verification profile.
raw-pointer-backend = []

[lib]
name = "sxd_document_no_unsafe"
path = "../../src/sxd_document/lib.rs"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("embedded"))'] }

[dependencies]
peresil = "0.3.0"
typed-arena = "2.0"
